# Use with docker-compose.yml. Test runners are temporary and keep dependencies
# inside containers, so Node.js/npm are not required on the host.
services:
  backend-tests:
    build: ./backend
    environment:
      NODE_ENV: test
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: vending_machine
      MYSQL_USER: vending_user
      MYSQL_PASSWORD: vending_pass
      MONGO_URI: mongodb://mongodb:27017/vending_logs
    volumes:
      - ./backend:/source:ro
    command:
      - sh
      - -c
      - cp -R /source /tmp/backend && cd /tmp/backend && npm ci --include=dev --no-audit --no-fund && npm test
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - vending_network

  frontend-check:
    build:
      context: ./frontend
      target: builder
    command: npm run lint
